<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>바다 한누네 | 해수욕장 정보</title><style>*{box-sizing:border-box}body{margin:0;background:#f1f8fa;color:#173447;font-family:Arial,"Noto Sans KR",sans-serif}.page{max-width:760px;margin:auto;padding:18px}.back{border:0;background:none;color:#177a98;font-weight:700;padding:7px 0;cursor:pointer}.hero{margin-top:8px;border-radius:23px;overflow:hidden;background:#fff;box-shadow:0 7px 20px #59747d25}.cover{height:210px;background:#a8dfe9 center/cover}.cover img{width:100%;height:100%;object-fit:cover}.inside{padding:18px}.place{margin:0;font-size:26px}.sub{margin:7px 0 0;color:#687f8d;font-size:13px}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:15px}.metric{border-radius:17px;padding:15px;color:white;background:linear-gradient(135deg,#087ca8,#08a7b9)}.metric.crowd{background:linear-gradient(135deg,#ee8057,#f4b35d)}.metric small{opacity:.86}.metric strong{display:block;font-size:27px;margin-top:5px}.metric em{font-style:normal;font-size:12px}.refresh{font-size:12px;color:#69808e;margin:12px 2px 0}.card{margin-top:15px;padding:18px;border-radius:21px;background:#fff;box-shadow:0 5px 16px #59747d1c}.card h2{font-size:18px;margin:0 0 8px}.details{display:none;background:#eff9fa;border-radius:13px;padding:11px;margin-top:10px;font-size:14px;line-height:1.85}.smallbtn,.post{border:0;border-radius:11px;padding:9px 12px;cursor:pointer;font-weight:700}.smallbtn{background:#e0f3f7;color:#14718f;font-size:12px}.food{display:inline-flex;gap:7px;align-items:center;padding:10px 12px;border-radius:12px;background:#fff5e8;color:#9d591f;text-decoration:none;font-size:14px;font-weight:700}.chat{background:#edfafd;padding:12px;border-radius:15px;max-height:300px;overflow:auto}.bubble{max-width:89%;padding:10px 12px;margin:7px 0;border-radius:13px;line-height:1.45;font-size:14px;white-space:pre-line}.bot{background:white;border-bottom-left-radius:3px}.user{background:#147e9d;color:#fff;margin-left:auto;border-bottom-right-radius:3px}.ask{display:flex;gap:8px;margin-top:10px}.ask input{flex:1;border:1px solid #c8dce1;border-radius:11px;padding:11px;font-size:14px}.ask button{background:#157f9e;color:#fff;border:0;border-radius:11px;padding:0 14px;font-weight:bold;cursor:pointer}.note{color:#687f8d;font-size:12px;margin:7px 0 0}.review-form textarea{width:100%;min-height:73px;padding:11px;border:1px solid #c8dce1;border-radius:12px;resize:vertical;font:inherit}.formrow{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-top:9px}.upload{font-size:13px;color:#187794;font-weight:bold}.upload input{display:none}.post{background:#167f9f;color:#fff}.preview{display:flex;gap:7px;overflow:auto;margin-top:9px}.preview img{width:64px;height:64px;border-radius:9px;object-fit:cover}.review{margin-top:11px;padding:12px;border:1px solid #e0ecee;border-radius:14px;background:#fff}.review-top{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:13px}.review p{margin:8px 0 0;line-height:1.5;font-size:14px}.review img{width:94px;height:72px;object-fit:cover;border-radius:9px;margin:9px 6px 0 0}.del{border:0;background:#fcebed;color:#ba4350;border-radius:8px;padding:5px 7px;cursor:pointer;font-size:12px}.static{color:#68808d;font-size:12px}.empty{color:#718590;font-size:14px;padding:8px 0}@media(max-width:460px){.page{padding:12px}.cover{height:180px}.metrics{gap:8px}.metric strong{font-size:24px}}</style></head><body><main class="page"><button class="back" onclick="location.href='busan-beach-watch.html'" id="back">← 지도로 돌아가기</button><section class="hero"><div class="cover"><img id="photo" alt="해수욕장 사진"></div><div class="inside"><h1 class="place" id="beach"></h1><p class="sub" id="summary"></p><div class="metrics"><div class="metric"><small id="weatherLabel">날씨 점수</small><strong id="weatherScore">–</strong><em id="weatherHint"></em></div><div class="metric crowd"><small id="crowdLabel">혼잡도 점수</small><strong id="crowdScore">–</strong><em id="crowdHint"></em></div></div><p class="refresh" id="refresh"></p></div></section><section class="card"><h2 id="weatherTitle">날씨 상세</h2><button class="smallbtn" id="detailBtn">날씨 자세히 보기</button><div class="details" id="details"></div></section><section class="card"><h2 id="foodTitle">주변 맛집</h2><a class="food" id="foodLink" target="_blank" rel="noopener">🍜 주변 맛집 찾아보기</a></section><section class="card"><h2 id="aiTitle">AI 해수욕장 도우미</h2><p class="note" id="aiNote">현재 화면의 환경 정보를 바탕으로 대화합니다.</p><div class="chat" id="chat"></div><form class="ask" id="ask"><input id="question" autocomplete="off" placeholder="예: 지금 수영하기 괜찮아?" required><button id="send">전송</button></form></section><section class="card"><h2 id="reviewTitle">인증샷 · 사용자 후기</h2><p class="note" id="reviewNote">후기를 쓰고 사진도 함께 올려 보세요. 내가 올린 글은 이 기기에서 삭제할 수 있어요.</p><div class="review-form"><textarea id="reviewText" placeholder="오늘 해수욕장은 어땠나요? 다른 방문객에게 알려주세요."></textarea><div class="formrow"><label class="upload">📷 사진 추가 <input id="reviewPhoto" type="file" accept="image/*" multiple></label><button class="post" id="post">후기 올리기</button></div><div class="preview" id="preview"></div></div><div id="reviews"></div></section></main><script>
const q=new URLSearchParams(location.search),beach=q.get('beach')||'해운대 해수욕장';const lang=q.get('lang')||localStorage.getItem('badaHannuneLang')||'ko';localStorage.setItem('badaHannuneLang',lang);const I=id=>document.getElementById(id);const copy={ko:{back:'← 지도로 돌아가기',w:'날씨 점수',c:'혼잡도 점수 (10점이 가장 혼잡)',wt:'날씨 상세',db:'날씨 자세히 보기',dt:'날씨 상세 닫기',food:'주변 맛집',fl:'🍜 주변 맛집 찾아보기',ai:'AI 해수욕장 도우미',an:'현재 화면의 환경 정보를 바탕으로 대화합니다.',ph:'예: 지금 수영하기 괜찮아?',send:'전송',rt:'인증샷 · 사용자 후기',rn:'후기를 쓰고 사진도 함께 올려 보세요. 내가 올린 글은 이 기기에서 삭제할 수 있어요.',rp:'오늘 해수욕장은 어땠나요? 다른 방문객에게 알려주세요.',post:'후기 올리기',del:'삭제',empty:'아직 작성한 후기가 없어요. 첫 후기를 남겨 보세요.',demo:'데모 데이터 · 3분마다 자동 갱신'},en:{back:'← Back to map',w:'Weather score',c:'Crowd score (10 = most crowded)',wt:'Weather details',db:'Show weather details',dt:'Hide weather details',food:'Nearby food',fl:'🍜 Find nearby places to eat',ai:'AI beach helper',an:'I use the environmental information shown on this page.',ph:'e.g. Is swimming a good idea now?',send:'Send',rt:'Photos · visitor reviews',rn:'Write a review and add photos. Your posts can be deleted on this device.',rp:'How was your visit? Share it with others.',post:'Post review',del:'Delete',empty:'No visitor reviews yet. Be the first to post one.',demo:'Demo data · updates automatically every 3 minutes'},ja:{back:'← 地図に戻る',w:'天気スコア',c:'混雑スコア（10が最も混雑）',wt:'天気の詳細',db:'天気を詳しく見る',dt:'詳細を閉じる',food:'周辺グルメ',fl:'🍜 周辺の飲食店を探す',ai:'AI ビーチ案内',an:'この画面の環境情報を基に会話します。',ph:'例：今、泳いでも大丈夫？',send:'送信',rt:'写真・利用者レビュー',rn:'レビューと写真を投稿できます。自分の投稿はこの端末で削除できます。',rp:'今日の海水浴場はどうでしたか？',post:'レビューを投稿',del:'削除',empty:'まだレビューがありません。最初のレビューを残しましょう。',demo:'デモデータ · 3分ごとに自動更新'},zh:{back:'← 返回地图',w:'天气评分',c:'拥挤评分（10分最拥挤）',wt:'天气详情',db:'查看天气详情',dt:'收起天气详情',food:'附近美食',fl:'🍜 查找附近美食',ai:'AI 海滩助手',an:'我会根据当前页面的环境信息进行回答。',ph:'例如：现在适合游泳吗？',send:'发送',rt:'照片 · 用户评价',rn:'写下评价并上传照片。你发布的内容可在此设备删除。',rp:'今天的海滩怎么样？分享给其他人吧。',post:'发布评价',del:'删除',empty:'还没有评价，来留下第一条吧。',demo:'演示数据 · 每 3 分钟自动更新'}};const t=copy[lang]||copy.ko;document.documentElement.lang=lang;const textMap={back:'back',weatherLabel:'w',crowdLabel:'c',weatherTitle:'wt',foodTitle:'food',foodLink:'fl',aiTitle:'ai',aiNote:'an',question:'ph',send:'send',reviewTitle:'rt',reviewNote:'rn',reviewText:'rp',post:'post'};Object.entries(textMap).forEach(([id,k])=>{const e=I(id);if(e.placeholder)e.placeholder=t[k];else e.textContent=t[k]});I('foodLink').href='https://map.kakao.com/?q='+encodeURIComponent(beach+' 맛집');
let base={people:parseInt((q.get('people')||'1240').replace(/\D/g,'')),temp:parseFloat(q.get('temp')||29),wind:parseFloat(q.get('wind')||3.1),water:beach.includes('광안')?25.9:beach.includes('송도')?25.1:beach.includes('다대')?24.8:25.5,humidity:beach.includes('광안')?70:67,sun:beach.includes('다대')?690:760};I('beach').textContent=beach;I('photo').src=q.get('photo')||'';I('photo').onerror=()=>I('photo').style.display='none';
function scoreWeather(m){let p=Math.abs(m.temp-27)*.36+Math.max(0,m.wind-2.5)*.28+Math.abs(m.water-25)*.12+Math.abs(m.humidity-60)*.025+Math.max(0,m.sun-700)*.002;return Math.max(0,Math.min(10,10-p*2)).toFixed(2)}function scoreCrowd(m){let density=m.people/(beach.includes('해운대')?2800:beach.includes('광안')?2500:beach.includes('송도')?1100:800);return Math.max(0,Math.min(10,density*9.6)).toFixed(2)}function refreshMetrics(){const turn=Math.floor(Date.now()/180000),seed=[...beach].reduce((a,c)=>a+c.charCodeAt(0),0),d=((turn*17+seed)%13)-6,m={...base,people:Math.max(30,Math.round(base.people*(1+d/100))),temp:+(base.temp+d*.08).toFixed(1),wind:Math.max(.4,+(base.wind+d*.06).toFixed(1)),water:+(base.water+d*.03).toFixed(1),humidity:Math.round(base.humidity+d*.5),sun:Math.round(base.sun+d*5)};window.current=m;const ws=scoreWeather(m),cs=scoreCrowd(m);I('weatherScore').textContent=ws+' / 10';I('crowdScore').textContent=cs+' / 10';I('weatherHint').textContent=m.temp+'°C · '+m.wind+' m/s';I('crowdHint').textContent=m.people.toLocaleString()+'명 · 면적 대비';I('summary').textContent='현재 추정 인원 '+m.people.toLocaleString()+'명 · '+(Number(cs)>=7?'혼잡':Number(cs)>=4?'보통':'여유');I('details').innerHTML='기온 <b>'+m.temp+'°C</b> · 바람 <b>'+m.wind+' m/s</b><br>수온 <b>'+m.water+'°C</b> · 습도 <b>'+m.humidity+'%</b> · 일사량 <b>'+m.sun+' W/㎡</b><br><span class="note">날씨 점수는 기온·바람·수온·습도·일사량의 쾌적 범위를 종합한 데모 지표입니다.</span>';I('refresh').textContent=t.demo+' · '+new Date().toLocaleTimeString(lang==='ko'?'ko-KR':undefined,{hour:'2-digit',minute:'2-digit'})}refreshMetrics();setInterval(refreshMetrics,180000);I('detailBtn').onclick=()=>{const d=I('details'),open=d.style.display==='block';d.style.display=open?'none':'block';I('detailBtn').textContent=open?t.db:t.dt};
const chat=I('chat');function addBubble(msg,who){const e=document.createElement('div');e.className='bubble '+who;e.textContent=msg;chat.append(e);chat.scrollTop=chat.scrollHeight}function reply(question){const s=question.toLowerCase(),m=window.current,ws=scoreWeather(m),cs=scoreCrowd(m),crowd=Number(cs)>=7?'혼잡한 편':Number(cs)>=4?'보통 수준':'여유 있는 편';if(/수영|물놀이|입수/.test(s))return '지금 수온은 '+m.water+'°C, 바람은 '+m.wind+' m/s예요. 날씨 점수는 '+ws+'점이라 물놀이는 무난해 보이지만, 입수 전 파도·안전요원 안내를 꼭 확인해 주세요.';if(/혼잡|사람|붐비|한산/.test(s))return '현재 추정 인원은 '+m.people.toLocaleString()+'명이고 혼잡도 점수는 '+cs+'점이에요. 지금은 '+crowd+'입니다. 더 편하게 쉬고 싶다면 해변 중앙보다 가장자리 쪽을 추천해요.';if(/날씨|기온|바람|비|우산|덥/.test(s))return '기온 '+m.temp+'°C, 바람 '+m.wind+' m/s, 습도 '+m.humidity+'%로 표시돼요. 날씨 점수는 '+ws+'점입니다. 햇볕이 강할 수 있으니 모자와 물을 챙기면 좋아요.';if(/준비|챙|준비물|추천/.test(s))return '지금 조건이라면 물·자외선 차단제·얇은 겉옷을 추천해요. 바람이 '+m.wind+' m/s라 해 질 무렵에는 체감온도가 낮아질 수 있어요.';if(/맛집|밥|식당|먹/.test(s))return '아래의 “주변 맛집 찾아보기”를 누르면 '+beach+' 주변 식당을 바로 검색할 수 있어요. 해수욕장 방문 전후 시간에는 대기 시간이 길 수 있으니 미리 확인해 보세요.';if(/안전|위험|파도|주의/.test(s))return '앱의 점수는 방문 판단을 돕는 데모 정보예요. 실제 입수 전에는 현장 안전요원 안내, 파고·이안류 경보, 기상특보를 우선으로 확인해 주세요.';return '“'+question+'”에 대해 지금 화면 기준으로 보면, '+beach+'은(는) 날씨 '+ws+'점·혼잡도 '+cs+'점이에요. 기온 '+m.temp+'°C와 바람 '+m.wind+' m/s 조건을 고려하면 '+crowd+'으로 보입니다. 수영, 준비물, 혼잡 시간, 안전 중 무엇을 더 알고 싶은지 물어보세요.'}addBubble('안녕하세요! '+beach+'의 현재 데모 환경 정보를 바탕으로 도와드릴게요. 궁금한 점을 편하게 물어보세요.','bot');I('ask').onsubmit=e=>{e.preventDefault();const v=I('question').value.trim();if(!v)return;addBubble(v,'user');I('question').value='';setTimeout(()=>addBubble(reply(v),'bot'),260)};
const key='badaHannuneReviewsV2:'+beach;let pending=[];function saved(){try{return JSON.parse(localStorage.getItem(key)||'[]')}catch{return[]}}function store(a){localStorage.setItem(key,JSON.stringify(a))}function staticReview(){return '<article class="review"><div class="review-top"><b>범수</b><span class="static">인증샷</span></div><p>팀원들과 바다 한누네를 준비 중이에요! 다음에는 진짜 바다에서 인증샷 남길게요 🌊</p><img src="bumsu-checkin-1.jpg" alt="범수 인증샷"><img src="bumsu-checkin-2.jpg" alt="범수 인증샷"></article>'}function draw(){const list=I('reviews'),a=saved();list.innerHTML=staticReview()+ (a.length?'':('<p class="empty">'+t.empty+'</p>'));a.slice().reverse().forEach(r=>{const e=document.createElement('article');e.className='review';e.innerHTML='<div class="review-top"><b>나</b><button class="del">'+t.del+'</button></div><p></p>';e.querySelector('p').textContent=r.text;e.querySelector('.del').onclick=()=>{store(saved().filter(x=>x.id!==r.id));draw()};list.append(e)})}I('reviewPhoto').onchange=e=>{pending=[...e.target.files].slice(0,3).map(f=>URL.createObjectURL(f));I('preview').innerHTML=pending.map(u=>'<img src="'+u+'" alt="업로드할 사진">').join('')};I('post').onclick=()=>{const v=I('reviewText').value.trim();if(!v){I('reviewText').focus();return}const a=saved();a.push({id:Date.now(),text:v});store(a);I('reviewText').value='';I('reviewPhoto').value='';pending=[];I('preview').innerHTML='';draw()};draw();
</script></body></html>
